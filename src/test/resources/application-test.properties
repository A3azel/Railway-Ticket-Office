# Конфиг для тестов, накладывается поверх основного application.properties.
# Имя файла намеренно профильное: одноимённый application.properties в test-classpath
# затенил бы основной целиком, а вместе с ним и spring.mail.host, по которому
# включается автоконфигурация JavaMailSender.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Railway_Ticket_Office}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.mail.username=${SPRING_MAIL_USERNAME:test@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}

app.base-url=http://localhost:8080
app.top-up.max-amount=10000
