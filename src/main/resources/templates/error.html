<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" >
    <title>error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link th:href="@{/CSS/footer.css}" rel="stylesheet">
</head>
<body>

<div class="wrapper">
    <div th:include="header::head" style="padding-bottom: 30px"></div>

    <main>
        <section class="gradient-custom">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 text-center">
                        <h2 th:text="#{error.title}">Error</h2>
                        <p th:if="${errorMessage}" th:text="${errorMessage}"></p>
                        <p th:unless="${errorMessage}" th:text="#{error.generic}"></p>
                        <a th:href="@{/}" class="btn btn-outline-primary">[[#{head.link.home}]]</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div th:include="footer::foot"></div>
</div>

</body>
</html>
