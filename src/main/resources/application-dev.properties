# Локальная разработка: запускать с SPRING_PROFILES_ACTIVE=dev
# (в IntelliJ: Run Configuration -> Active profiles: dev).
# Прод-конфиг в application.properties намеренно требует env-переменные и падает без них.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Railway_Ticket_Office}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Пустые по умолчанию: без них приложение поднимется, просто письма не отправятся.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Детали health-check полезны локально, в проде остаются скрытыми.
management.endpoint.health.show-details=always
