spring.jpa.hibernate.ddl-auto=update
# Hibernate 6 переносит ограничения Bean Validation в метаданные колонок. Из-за
# @Digits(integer=1, fraction=2) на поле double (TicketType.ticketPriceFactor) он
# выставляет scale, недопустимый для чисел с плавающей точкой, и падает на старте
# ("scale has no meaning for SQL floating point types"). Hibernate 5 это игнорировал.
# Отключаем только влияние на схему — runtime-валидация формы продолжает работать.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
# Без значений по умолчанию: приложение должно падать на старте, а не молча
# подключаться не туда. Локальный запуск — через профиль dev (см. application-dev.properties).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql: true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Внешний адрес приложения — попадает в ссылку активации аккаунта в письме.
app.base-url=${APP_BASE_URL}

# Пополнение счёта не подключено к платёжному провайдеру: пользователь просто
# прибавляет себе баланс. До появления реальной оплаты потолок разового пополнения —
# единственное ограничение, см. UserServiceI#topUpAccount.
app.top-up.max-amount=${APP_TOP_UP_MAX_AMOUNT:10000}

# За ALB (или любым reverse proxy) нужно доверять X-Forwarded-*, иначе Spring
# построит редиректы на http и внутренний адрес задачи вместо публичного хоста.
server.forward-headers-strategy=framework

server.servlet.session.timeout=600s

# Health check для target group ALB: /actuator/health/readiness.
# show-details=never — чтобы не светить внутренности наружу.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# readiness по умолчанию содержит только readinessState, поэтому БД добавляем явно:
# без БД приложение бесполезно, и ALB должен перестать слать на него трафик.
# liveness намеренно оставляем без БД — иначе недоступность RDS заставит ECS
# бесконечно перезапускать исправные задачи.
management.endpoint.health.group.readiness.include=readinessState,db

# Mail-индикатор открывает SMTP-соединение на каждую проверку health и роняет
# общий статус в DOWN при любых проблемах с почтой. Отправка писем асинхронная и
# не влияет на способность обслуживать запросы — из health его исключаем.
management.health.mail.enabled=false

logging.level.root=info
logging.level.com.lankydan.service=error

logging.pattern.file=%d {dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M - %msg%n
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M - %msg%n


pdf.path=${PDF_PATH:src/main/resources/ticketPDF/}
pdf.path.forEmail=${PDF_PATH_FOR_EMAIL:src/main/resources/ticketPDF/}
fonts.path=${FONTS_PATH:src/main/resources/fonts/DejaVuSans.ttf}
