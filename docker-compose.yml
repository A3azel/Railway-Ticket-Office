services:
  db:
    image: mysql:8.0
    container_name: railway-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Railway_Ticket_Office
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: railway-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Переопределяем localhost из application.properties на имя сервиса db
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/Railway_Ticket_Office
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # Почтовые креды берутся из окружения хоста (см. .env), а не хардкодятся
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Адрес, по которому приложение доступно снаружи — идёт в ссылку активации в письме
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"

volumes:
  db-data:
